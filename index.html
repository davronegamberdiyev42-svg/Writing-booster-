<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:18px 16px 96px}

<div class="w"><div class="hd"><div><h1><span>Writing BS</span></h1><div class="mut">Kuniga 25 daqiqa. 100 kun.</div></div><div class="kp" id="kp"></div></div><div id="app"></div></div>
<nav class="tabs" id="tabs"></nav>
<script>
const CL={M:"#e5484d",N:"#2f5bea",Q:"#12a37f",T:"#a45cf0",S:"#e08a00"};
const MN={M:"Material",N:"Namuna tahlili",Q:"Qurish",T:"Tahrir",S:"Haftalik sharh"};
const WD=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"],WS=["Ya","Du","Se","Ch","Pa","Ju","Sh"];
const WK=["S","M","N","Q","T","M","Q"];
const PH=["Poydevor: material va namunalar","Qurilish: toʻliq qoralamalar","Sayqal: DS inshosi va topshirishga tayyorlik"];
const ST={
M:[[3,"Oldingi sessiya yozuvi va Xatolar daftaridagi 1 maqsadni oʻqing."],[10,"Toʻxtamay yozing (imlo muhim emas): qayerda, nima qildingiz, nima boʻldi."],[7,"4 qatorga tuzing: sahna / harakat / natija / nimani tushundim."],[5,"Xatolar daftariga 1 qator yozing, keyingi qadamni belgilang."]],
N:[[3,"Oldingi yozuvingiz va Xatolar daftarini koʻzdan kechiring."],[10,"Bitta kuchli insho yoki SOP namunasini oʻqing (MIT Admissions blogi, kollejlar e’lon qilgan insholar)."],[7,"Har paragrafni 1 jumlada umumlashtiring (reverse outline), soʻng bitta paragraf tuzilmasini oʻz mavzuingizga koʻchiring."],[5,"Nimani oʻrgandingiz? 1 qator yozing."]],
Q:[[3,"Tanlangan kartani oʻqing, bitta asosiy fikrni belgilang."],[3,"Reja: sahna → savol → harakat → xulosa."],[14,"Qoralamani toʻxtamay yozing."],[5,"Soʻzlarni sanang, eng zaif joyni Xatolar daftariga yozing."]],
T:[[3,"Qoralama va oldingi feedbackni oʻqing."],[7,"Kesish: ortiqcha soʻz, passiv nisbat, mavhum iboralar."],[10,"Feedbackni qoʻllang yoki qoralamani yuboring."],[5,"Nima oʻzgardi? 1 qator yozing."]],
S:[[3,"Hafta yozuvlarini varaqlang."],[10,"Eng yaxshi jumlani tanlang va nega yaxshiligini yozing."],[7,"5 mezon boʻyicha oʻzingizni 1–4 ball bilan baholang: aniqlik, tushuncha, ovoz, ixchamlik, tuzilma."],[5,"Keyingi hafta maqsadini Xatolar daftariga yozing."]]};
const PM=["Oxirgi marta biror narsani tushunmaguningizcha urinib koʻrgan lahza.","Ma’lumot (sanash, taqqoslash, jadval) bilan muammo hal qilishga urinish.","Xato qilgan va undan oʻrgangan paytingiz.","Sizni “nega?” deb oʻylantirgan kuzatuv.","Mustaqil oʻrgangan narsangiz: qanday topdingiz, nima qiyin boʻldi.","Kimgadir biror narsani tushuntirgan lahza.","Raqamlar fikringizni oʻzgartirgan voqea.","Data science’ga qiziqishingiz paydo boʻlgan sahna."];
const FN=["Ochilish jumlasi","Aniq otlar va fe’llar","Burilish nuqtasi","Oxirgi jumla","Ovoz: bu kim yozgan?","Mavhum fikr aniq misolga aylangan joy"];
const PQ=["Kartadan 300 soʻzli sahna: sahna → savol → harakat → xulosa.","Kartadan 650 soʻzli qoralama: sahna → ziddiyat → harakat → tushuncha → data science’ga koʻprik.","“Nega data science?” 250 soʻz: bitta aniq lahza yoki loyiha + kelajak maqsad."];
const PT=["Eng yaxshi kartangizdan 2 jumlani 20% qisqartiring; mavhum soʻzni aniq harakat bilan almashtiring.","Qoralamani tashqi odamga yuboring (oʻqituvchi, tengdosh, mentor yoki Claude), feedbackdan 3 ta oʻzgartirish qiling.","Finalist inshoni 48 soat dam bergach qayta oʻqing: ortiqcha 10% ni kesing, ochilish va yakun jumlasini kuchaytiring."];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let S={start:iso(new Date()),days:{}};
try{const r=localStorage.getItem("wbs1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("wbs1",JSON.stringify(S))}catch(e){}};
const tIdx=()=>{const a=new Date(S.start+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)};
let sel=Math.min(Math.max(tIdx(),0),99),view="today",rs=0;
function plan(i){
 const d=new Date(S.start+"T00:00:00");d.setDate(d.getDate()+i);
 const wd=d.getDay(),m=WK[wd],k=Math.floor(i/7),ph=k<4?0:k<9?1:2;
 let title=MN[m],pr,st=ST[m];
 if(m==="M")pr=PM[(k+wd)%PM.length];
 if(m==="N")pr="Diqqat markazi: "+FN[(k+wd)%FN.length]+".";
 if(m==="Q")pr=PQ[ph];
 if(m==="T")pr=PT[ph];
 if(m==="S")pr="Haftaning yakuni: baholang, tanlang, reja tuzing.";
 if(i===0){title="Boshlangʻich insho (baseline)";pr="“Nega data science?” mavzusida 25 daqiqa ichida 300 soʻz yozing. Tahrir qilmang. 50- va 100-kunlarda shu mavzuni qayta yozib solishtirasiz.";st=[[25,"Toʻxtamay yozing va matnni saqlab qoʻying."]]}
 if(i===49||i===99){title="Baseline’ni qayta yozish";pr="Birinchi kundagi mavzuni (“Nega data science?”) qayta yozing va 1-kundagi matn bilan solishtiring.";st=[[5,"1-kundagi matnni oʻqing."],[17,"Mavzuni yangidan yozing (300 soʻz)."],[3,"Farqlarni 3 qatorda yozing."]]}
 return{i,wd,m,ph,title,pr,st,ds:iso(d)};
}
const done=i=>!!(S.days[i]&&S.days[i].d);
let TM={run:false,end:0,left:1500e3,iv:0};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
function tick(){
 if(TM.run){TM.left=Math.max(0,TM.end-Date.now());if(!TM.left){TM.run=false;clearInterval(TM.iv);beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}try{new Notification("Writing BS",{body:"25 daqiqa tugadi. Sessiyani yakunlang."})}catch(e){}}}
 const el=$("#tt");if(!el)return;
 const l=Math.ceil(TM.left/1e3),txt=String(Math.floor(l/60)).padStart(2,"0")+":"+String(l%60).padStart(2,"0");
 el.textContent=txt;document.title=TM.run?txt+" · Writing BS":"Writing BS";
 const st=plan(sel).st,el2=1500e3-TM.left;let c=0,k=st.length-1;
 for(let j=0;j<st.length;j++){c+=st[j][0]*60e3;if(el2<c){k=j;break}}
 $("#tp").textContent=TM.left?(TM.run||el2>0?(k+1)+"/"+st.length+": "+st[k][1]:"Tayyor boʻlsangiz, boshlang."):"Vaqt tugadi.";
 $("#tb").textContent=TM.run?"Pauza":(el2>0&&TM.left?"Davom etish":"Boshlash");
}
function tStart(){
 if(TM.run){TM.run=false;clearInterval(TM.iv);tick();return}
 if(!TM.left)TM.left=1500e3;
 TM.end=Date.now()+TM.left;TM.run=true;clearInterval(TM.iv);TM.iv=setInterval(tick,250);
 try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
 tick();
}
function tReset(){TM.run=false;clearInterval(TM.iv);TM.left=1500e3;tick()}
function go(i){sel=i;view="today";render();window.scrollTo(0,0)}
function vPlan(){
 let h='<div class="mut" style="margin-bottom:12px">Reja haftaning kunlariga joylangan: Du/Chor — material, Se — namuna, Chor/Sh — qurish, Pa — tahrir, Ya — sharh. Kun oʻtkazib yuborsangiz, keyingisiga surilmaydi: istalgan kunni bosib bajarishingiz mumkin.</div>';
 const lg=Object.keys(MN).map(k=>'<span class="chip" style="background:'+CL[k]+';margin-right:4px">'+k+" "+MN[k]+"</span>").join("");
 h+='<div style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px">'+lg+"</div>";
 for(let k=0;k<15;k++){
  if(k===0||k===4||k===9)h+='<h3 style="margin:16px 0 8px">'+PH[k<4?0:k<9?1:2]+"</h3>";
  let c="";for(let i=k*7;i<Math.min(100,k*7+7);i++)c+=cell(i,1);
  h+='<div class="mut">Hafta '+(k+1)+'</div><div class="wk">'+c+"</div>";
 }
 return h;
}
function imp(){try{const o=JSON.parse($("#bk").value);if(o&&o.start&&o.days){S=o;save();render()}}catch(e){$("#bk").value="Format notoʻgʻri. Zaxira nusxani aynan nusxalab yopishtiring."}}
function rst(){const b=$("#rb");if(rs++){S={start:iso(new Date()),days:{}};save();rs=0;sel=0;render()}else b.textContent="Tasdiqlang: hammasi oʻchadi"}
const RB=["Boshladim, lekin 5 daqiqadan kam ishladim.","Qisman bajardim, tez chalgʻidim.","Vaqtning yarmini ishlatdim, qadamlar tashlandi.","Koʻp qadam bajarildi, lekin diqqat past edi.","Hamma qadam bajarildi, ammo rasmiy, ichki fikrsiz.","Bajardim va 1 ta aniq natija bor (jumla, karta yoki qoralama).","Yaxshi: aniq natija bor va Xatolar daftari toʻldirildi.","Juda yaxshi: aniq misollar yozdim va 1 ta kamchiligimni topdim.","Aʼlo: natijani qayta yozdim va oldingisidan yaxshiroq ekanini koʻrdim.","Ideal: toʻliq diqqat, sifatli natija va tashqi feedback yoki aniq taqqoslash bor."];
const TIER=["Past natija odatiy holat. Sababini toping: chalgʻituvchi nima edi? Keyingi sessiyani telefonsiz, 15 daqiqalik minimal versiyada boshlang.","Qoniqarli, lekin natija yetarli aniq emas. Keyingi safar sessiya oxirida 1 ta aniq jumla yoki karta chiqarishni maqsad qiling.","Yaxshi natija. Endi bitta narsani yaxshilang: bugungi eng zaif jumlani qayta yozing.","Aʼlo sifat. Bu yozuv Bankda saqlanadi; uni tashqi odamga koʻrsatishni rejalashtiring."];
const MT={M:"Material: “fikr”ni emas, lahzani yozing: kim, qayerda, nima qildi yoki dedi.",N:"Namuna: faqat oʻqib chiqmang, har paragrafning vazifasini 1 jumlada yozing.",Q:"Qurish: avval bitta asosiy fikrni 1 jumlada yozing, keyin qoralama.",T:"Tahrir: avval kesing, keyin yangi narsa qoʻshing.",S:"Sharh: ball bilan birga 1 ta dalil (jumla) yozing."};
const LS={
M:[{t:"Lahza, mavzu emas",b:"“Men yetakchiman” — mavzu. “Kechki 11 da jadvalni qayta tuzdim, chunki 3 ta ustun mos kelmasdi” — lahza. Insho lahzadan boshlanadi."},{t:"Sezgi detallari",b:"Sahnaga kamida 2 ta sezgi qoʻshing: nimani koʻrdingiz, eshitdingiz, qoʻlingizda nima bor edi. Aniq detal ishonch yaratadi."},{t:"Uch savol",b:"Har kartaga 3 savol bering: Nimani bilmasdim? Nima qildim? Endi nimani boshqacha qilaman? Uchinchisi insho yuragi."}],
N:[{t:"Paragraf vazifasi",b:"Har paragrafning bitta vazifasi bor: sahna ochish, burilish yoki tushuncha. Vazifani yozolmasangiz, paragraf ortiqcha."},{t:"Ochilish jumlasi",b:"Kuchli ochilish sahna yoki savol bilan boshlanadi, taʼrif bilan emas. Oʻqigan insholaringizda ochilish turini belgilang."},{t:"Nima yoʻq?",b:"Kuchli insholarda “men ajoyib yetakchiman” degan jumla yoʻq, harakat bor. Namunadan 3 ta aniq harakatni ajrating."}],
Q:[{t:"Bitta fikr",b:"650 soʻz = 1 asosiy fikr. Fikrni 1 jumlada yozolmasangiz, qoralamani boshlamang."},{t:"Ziddiyat",b:"Hikoyaga kuch beradigan narsa ziddiyat: nimani xohladingiz va nima toʻsiq boʻldi."},{t:"Data science koʻprigi",b:"Oxirida “data science qiziq” demang. Hikoyadagi savol qaysi maʼlumot savoliga aylanganini koʻrsating."}],
T:[{t:"Kesish qoidasi",b:"Har jumlani bir marta kesib koʻring: very, really, I think kabi soʻzlar va takror fikrlar. Maʼno yoʻqolmasa, kesing."},{t:"Aniq ot, faol fe’l",b:"“A decision was made” → “I chose”. Faol nisbat harakatni koʻrsatadi, aniq ot tasvirni."},{t:"Feedback soʻrash",b:"Oʻqiyotgandan 3 savol soʻrang: Qayerda zerikdingiz? Qaysi jumla yodingizda qoldi? Menga nima yetishmadi?"}],
S:[{t:"Dalilli baho",b:"Ball + dalil: “7, chunki 2 ta aniq sahna yozdim”. Dalilsiz ball shunchaki his."},{t:"Bitta maqsad",b:"Bir hafta = 1 maqsad. Koʻp xatoni emas, bittasini tuzating; keyingi hafta navbatdagisini."}]};
function lsx(l){return(l.e?'<div class="adv" style="margin-top:10px"><b>Oldin → keyin:</b> '+l.e+"</div>":"")+(l.m?'<div class="adv"><b>Mini mashq:</b> '+l.m+"</div>":"")}
LS.M.push(
{t:"Loyihadan lahza",b:"Data loyihangizdan natijani emas, qaror lahzasini oling: qaysi ustunni tashladingiz va nega.",e:"“I cleaned the data.” → “I deleted 212 rows with missing ages, then wondered whom I had just erased.”",m:"3 daq: oxirgi loyihangizdan 1 ta qarorni yozing. 2 daq: uning sababini yozing."},
{t:"Xato kartasi",b:"Xatolar kuchli material: nima kutdingiz, nima boʻldi, nimani oʻzgartirdingiz.",e:"“I learned from failure.” → “My model scored 98% because I had fed it the answer column.”",m:"4 daq: eng kulgili xatongizni 3 jumlada yozing."},
{t:"Dialog parchasi",b:"Bir ogʻiz gap sahnani jonlantiradi. Kimdir nima dedi? Aynan soʻzlarini yozing.",e:"“My teacher encouraged me.” → “‘Check the denominator,’ she said, and walked away.”",m:"3 daq: 1 ta aniq gapni eslang va kim aytganini yozing."},
{t:"Raqam bilan yozish",b:"Raqam mavhumlikni aniqlikka aylantiradi: nechta, qancha vaqt, qanchalik.",e:"“I worked hard on it.” → “I rebuilt the chart 14 times over six nights.”",m:"3 daq: kartangizga 2 ta aniq raqam qoʻshing."},
{t:"Qadriyat izi",b:"Qadriyatni e’lon qilmang, tanlovda koʻrsating: nimadan voz kechdingiz?",e:"“I value honesty.” → “I reported the error, though my score dropped.”",m:"4 daq: oxirgi qiyin tanlovingizni yozing: nima yoʻqotdingiz, nimani saqladingiz."},
{t:"Hayratlanish lahzasi",b:"Savolni uygʻotgan kuzatuv tadqiqotchi fikrlashning boshlanishi.",e:"“I like statistics.” → “Our bus was late every Thursday, so I started a spreadsheet.”",m:"4 daq: kundalik hayotdagi 1 ta qonuniyatni yozing, sizni hayron qoldirgan."},
{t:"Kimga foyda?",b:"Qilgan ishingiz boshqa odamga nima berdi? Hamjamiyatga ta’sir aniq odam va natija bilan yoziladi.",e:"“I helped my community.” → “My cousin now checks wheat prices on a sheet I made.”",m:"3 daq: 1 ta odamni va unga bergan foydangizni yozing."},

function fbPrompt(i){const p=plan(i),x=S.days[i]||{};return"Sen top universitetlarning tajribali admission officer’isan. Quyidagi yozuvni halol baholab ber (maqtov uchun ball oshirma).\n\nKontekst: Writing BS, kun "+(i+1)+", bosqich: "+MN[p.m]+". Vazifa: "+p.pr+" Oʻzimga qoʻygan ball: "+(x.s||"–")+"/10. Soʻz soni: "+(x.w||0)+".\n\nJavob formati:\n1) Umumiy ball: N/10 va 1–2 jumla dalil\n2) 5 mezon (1–4): aniqlik, tushuncha, ovoz, ixchamlik, tuzilma\n3) Eng kuchli jumla va nima uchun\n4) Eng zaif joy va uni qayta yozib koʻrsat\n5) Keyingi sessiya uchun 1 ta maqsad\n\nMATN:\n"+(x.x||"")}
function fbMake(){inp();const t=$("#fbp");t.value=fbPrompt(sel);t.style.display="block"}
function fbCopy(){fbMake();const t=$("#fbp"),m=$("#fbm");t.select();const ok=()=>{m.textContent="Nusxalandi. Endi Claude’ga yuboring."},no=()=>{try{if(document.execCommand("copy"))return ok()}catch(e){}m.textContent="Matn belgilandi: uzoq bosib “Copy” ni tanlang."};try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}}
function setE(v){inp();const n=Math.round(+v);S.days[sel].e=n>=1&&n<=10?n:undefined;save();render()}
function fbCard(x){
 if(!x.x||!x.x.trim())return'<div class="card"><h3>Tashqi feedback</h3><div class="mut">Avval matn yozing: feedback soʻrovi shu matndan tayyorlanadi.</div></div>';
 const g=x.s&&x.e?x.s-x.e:null;
 return'<div class="card"><h3>Tashqi feedback</h3><div class="mut">1) Soʻrovni tayyorlang. 2) Nusxalab, Claude’ga yuboring. 3) Javobdagi umumiy ballni pastga kiriting.</div><div class="row"><button onclick="fbMake()">Soʻrovni tayyorlash</button><button onclick="fbCopy()">Nusxalash</button></div><textarea id="fbp" rows="6" readonly style="display:none;margin-top:8px"></textarea><div id="fbm" class="mut"></div><label for="ex">Tashqi ball (1–10)</label><input id="ex" type="number" min="1" max="10" inputmode="numeric" value="'+esc(x.e||"")+'" onchange="setE(this.value)">'+(g!==null?'<div class="adv" style="margin-top:8px">Farq: '+(g>0?"+":"")+g+(g>1?" — oʻzingizni yuqoriroq baholadingiz.":g<-1?" — oʻzingizni qattiqroq baholadingiz.":" — baholashingiz aniq.")+"</div>":"")+"</div>";
}
function calCard(){
 const g=[];for(let i=0;i<100;i++){const x=S.days[i];if(x&&x.s&&x.e)g.push(x.s-x.e)}
 const h='<div class="card"><h3>Baholash aniqligi</h3>';
 if(!g.length)return h+'<div class="mut">Tashqi ball hali yoʻq. Qoralamani feedbackka yuboring va javobdagi ballni kun sahifasiga kiriting.</div></div>';
 const b=g.reduce((q,v)=>q+v,0)/g.length,m=g.reduce((q,v)=>q+Math.abs(v),0)/g.length;
 return h+'<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>'+g.length+'</b>solishtirish</div><div><b>'+m.toFixed(1)+'</b>oʻrt. farq</div><div><b>'+(b>0?"+":"")+b.toFixed(1)+'</b>moyillik</div></div><div class="adv">'+(b>=1.5?"Oʻzingizni tashqi bahodan yuqori baholayapsiz. Ball qoʻyishdan oldin 1 ta dalil jumla yozing.":b<=-1.5?"Oʻzingizni haddan tashqari qattiq baholayapsiz. Yutuqlaringizni ham dalil bilan yozing.":"Baholashingiz tashqi baho bilan yaxshi mos keladi.")+"</div></div>";
}
function bkInfo(){const d=S.bk?Math.floor((Date.now()-S.bk)/864e5):null;return d===null?"Hali zaxira olinmagan. Haftada kamida bir marta oling.":"Oxirgi zaxira: "+(d?d+" kun oldin":"bugun")+(d>=7?". Yangilash vaqti keldi.":".")}
function bkNote(m){const e=$("#bkm");if(e)e.textContent=m}
function bkCopy(){S.bk=Date.now();save();const t=$("#bk");t.value=JSON.stringify(S);t.select();const ok=()=>bkNote("Zaxira nusxalandi. Uni xavfsiz joyga (Notes, email) saqlang."),no=()=>{try{if(document.execCommand("copy"))return ok()}catch(e){}bkNote("Matn belgilandi: uzoq bosib “Copy” ni tanlang.")};try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}}
function bkFile(){S.bk=Date.now();save();try{const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="writing-bs-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove();bkNote("Fayl yuklab olindi. Saqlanmasa, “Nusxalash” tugmasidan foydalaning.")}catch(e){bkNote("Fayl saqlash bu muhitda ishlamadi. “Nusxalash” tugmasidan foydalaning.")}}
function bkLoad(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.start||typeof o.days!=="object")throw 0;S=o;save();render()}catch(e){bkNote("Fayl formati notoʻgʻri.")}};r.readAsText(f)}
let bf="";
function vBank(){
 const rows=[];for(let i=0;i<100;i++){const x=S.days[i];if(x&&x.x&&x.x.trim())rows.push(i)}
 const f=bf?rows.filter(i=>plan(i).m===bf):rows;
 let h='<div class="row" style="margin:0 0 12px">'+["",...Object.keys(MN)].map(k=>'<button class="'+(bf===k?"s2":"")+'" onclick="bf=\''+k+'\';render()">'+(k?MN[k]:"Hammasi")+"</button>").join("")+"</div>";
 const cm=[0,49,99].filter(i=>rows.includes(i));
 if(cm.length>1)h+='<div class="card"><h3>Baseline taqqoslash</h3>'+cm.map(i=>{const a=ana(S.days[i].x);return'<div class="adv"><b>Kun '+(i+1)+":</b> "+a.w+" soʻz · jumla "+a.sl+" · xilma-xillik "+a.div+"% · zaif iboralar "+a.hits.length+"</div>"}).join("")+"</div>";
 h+=f.length?f.map(i=>{const x=S.days[i],p=plan(i);return'<button class="bk" onclick="go('+i+')"><span class="chip" style="background:'+CL[p.m]+'">'+p.m+"</span> <b>Kun "+(i+1)+"</b> · "+x.w+" soʻz"+(x.s?" · ball "+x.s:"")+'<br><span class="mut">'+esc(x.x.slice(0,110))+"…</span></button>"}).join(""):'<div class="mut">Hozircha yozuv yoʻq. Bugungi sessiyada matn yozing, u shu yerda toʻplanadi.</div>';
 h+='<details class="card"><summary><b>Darslar kutubxonasi</b></summary>'+Object.keys(LS).map(k=>'<h3 style="margin:12px 0 4px;color:'+CL[k]+'">'+MN[k]+"</h3>"+LS[k].map(l=>"<p style=\"margin:4px 0\"><b>"+l.t+":</b> "+l.b+"</p>"+lsx(l)).join("")).join("")+"</details>";
 h+='<div class="card"><h3>Tashqi resurslar (10 ta)</h3>'+EX.map(e=>'<p style="margin:6px 0"><a href="'+e[2]+'" target="_blank" rel="noopener noreferrer" style="color:var(--ac)">'+e[1]+'</a> <span class="mut">· kun '+(e[0]+1)+"</span></p>").join("")+"</div>";
 return h;
}
function vStats(){
 const s=stats();
 const G=[["Gate 1: 20 ta material kartasi",s.bm.M/20],["Gate 2: 5 ta feedback bilan tahrir",s.bm.T/5],["Gate 3: 4 ta DS/finalist qurish sessiyasi",(()=>{let c=0;for(let i=63;i<100;i++)if(done(i)&&plan(i).m==="Q")c++;return c/4})()]];
 let bars="";s.wkn.forEach((w,k)=>{const hh=w[0]/w[1]*60;bars+='<rect x="'+(k*20+4)+'" y="'+(70-hh)+'" width="14" height="'+hh+'" rx="3" fill="var(--ac)"/><text x="'+(k*20+11)+'" y="82" text-anchor="middle">'+(k+1)+"</text>"});
 let g="";for(let i=0;i<100;i++)g+=cell(i,0);
 const pts=s.ss.map(a=>'<circle cx="'+(a[0]*3+2)+'" cy="'+(100-a[1]*9)+'" r="2" fill="var(--mut)"/>').join("");
 const ma=s.ss.map((a,k)=>{const sl=s.ss.slice(Math.max(0,k-6),k+1);return(a[0]*3+2)+","+(100-sl.reduce((q,b)=>q+b[1],0)/sl.length*9)}).join(" ");
 const mx=Math.max(1,...Object.values(s.bm));
 return'<div class="stats"><div><b>'+s.n+"</b>kun</div><div><b>"+s.sk+"</b>zanjir</div><div><b>"+(s.avg?s.avg.toFixed(1):"–")+"</b>oʻrt. ball</div><div><b>"+s.eff+"</b>samara</div></div>"+
 '<div class="card"><h3 style="margin-bottom:8px">Maslahat</h3>'+advice(s).map(a=>'<div class="adv">'+a+"</div>").join("")+"</div>"+
 '<div class="card"><h3 style="margin-bottom:8px">100 kunlik xarita</h3><div class="grid">'+g+'</div><div class="mut" style="margin-top:6px">Rang — bosqich turi, toʻqlik — ball.</div></div>'+
 '<div class="card"><h3>Ball dinamikasi</h3>'+(s.ss.length?'<svg viewBox="0 0 304 108" width="100%" role="img" aria-label="Ballar grafigi">'+pts+'<polyline points="'+ma+'" fill="none" stroke="var(--ac)" stroke-width="2.5"/><text x="2" y="106">1-kun</text><text x="302" y="106" text-anchor="end">100-kun</text></svg><div class="mut">Koʻk chiziq — 7 sessiyalik oʻrtacha.</div>':'<div class="mut">Birinchi ball qoʻyilgach grafik paydo boʻladi.</div>')+"</div>"+
 '<div class="card"><h3>Haftalik bajarilish</h3><svg viewBox="0 0 304 88" width="100%" role="img" aria-label="Haftalik bajarilgan kunlar">'+bars+"</svg></div>"+
 '<div class="card"><h3 style="margin-bottom:8px">Bosqichlar boʻyicha oʻrtacha ball</h3>'+Object.keys(MN).map(k=>{const q=s.sm[k],av=q[1]?q[0]/q[1]:0;return'<div class="mut">'+MN[k]+" · "+s.bm[k]+" kun · "+(q[1]?av.toFixed(1):"–")+'</div><div class="bar"><i style="width:'+av*10+"%;background:"+CL[k]+'"></i></div>'}).join("")+"</div>"+
 '<div class="card"><h3 style="margin-bottom:8px">Gate’lar</h3>'+G.map(x=>'<div class="mut">'+x[0]+" · "+Math.round(Math.min(1,x[1])*100)+'%</div><div class="bar"><i style="width:'+Math.min(1,x[1])*100+'%"></i></div>').join("")+"</div>"+
 calCard()+'<div class="card"><h3>Sozlamalar</h3><label for="sd">Boshlanish sanasi</label><input id="sd" type="date" value="'+S.start+'" onchange="S.start=this.value||S.start;save();sel=Math.min(Math.max(tIdx(),0),99);render()"><label for="bk">Zaxira nusxa</label><div class="mut" id="bkm">'+bkInfo()+'</div><textarea id="bk" rows="4">'+esc(JSON.stringify(S))+'</textarea><div class="row"><button onclick="bkCopy()">Nusxalash</button><button onclick="bkFile()">Faylga saqlash</button><button onclick="imp()">Matndan tiklash</button></div><label for="bf">Fayldan tiklash (.json)</label><input id="bf" type="file" accept="application/json,.json" onchange="bkLoad(this)"><div class="row"><button onclick="rst()" id="rb">Hammasini oʻchirish</button></div></div>';
}
function render(){
 const s=stats();
 $("#kp").innerHTML="<b>"+s.sk+"</b> kunlik zanjir<br>"+s.n+"/100 bajarilgan";
 $("#app").innerHTML=view==="today"?vToday():view==="plan"?vPlan():view==="bank"?vBank():vStats();
 $("#tabs").innerHTML=[["today","Bugun"],["plan","Reja"],["bank","Bank"],["stats","Natija"]].map(t=>'<button class="'+(view===t[0]?"on":"")+'" onclick="view=\''+t[0]+'\';rs=0;render();window.scrollTo(0,0)">'+t[1]+"</button>").join("");
 if(view==="today"){$("#x").oninput=inp;$("#lg").oninput=inp;tick()}
}
